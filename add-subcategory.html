<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adicionar Subcategoria</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="21752.png">
</head>
<body>
    <div class="container">
        <label for="editTextSubcategoryName">Nome da Subcategoria</label>
<input type="text" id="editTextSubcategoryName" placeholder="Nome da Subcategoria">

<label for="editTextSubcategoryImage">URL da Imagem da Subcategoria</label>
<input type="text" id="editTextSubcategoryImage" placeholder="URL da Imagem da Subcategoria">

<label for="editTextMaxIndex">Max Index</label>
<input type="number" id="editTextMaxIndex" placeholder="Max Index">

<label for="editTextQuestionsCount">Qtd de Questões</label>
<input type="number" id="editTextQuestionsCount" placeholder="Qtd de Questões">

<label for="editTextpointsPerQuestion">Pontos por Questão</label>
<input type="number" id="editTextpointsPerQuestion" placeholder="Pontos por questão">

<label for="editTextTime">Tempo em Segundos</label>
<input type="number" id="editTextTime" placeholder="Tempo em Segundos">

<!-- 🆕 NOVOS CAMPOS -->
<label for="editTextOrder">Ordem de Exibição (order)</label>
<input type="number" id="editTextOrder" placeholder="Ordem de Exibição (order)">

<label for="editTextEbookPdfUrl">URL do PDF do Ebook (ebookPdfUrl)</label>
<input type="text" id="editTextEbookPdfUrl" placeholder="URL do PDF do Ebook (ebookPdfUrl)">


        <select id="spinnerIsAdapted">
            <option value="false">Não Adaptado</option>
            <option value="true">Adaptado</option>
            
        </select>
        <button id="buttonAddSubcategory">Adicionar</button>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="main.js"></script>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = urlParams.get('categoryId');

        document.getElementById('buttonAddSubcategory').addEventListener('click', function() {
            addSubcategory(categoryId);
        });
    </script>
</body>
</html>
